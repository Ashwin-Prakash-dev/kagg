# adding, say, `lr0` here raises rather than silently breaking the control.

inherits: master.yaml
experiment: E02

# For reference only; read from master.yaml at runtime.
_resolution:
  label: r50
  scale: 0.5
  run_id: 02_r50
  area_scale: 0.25
